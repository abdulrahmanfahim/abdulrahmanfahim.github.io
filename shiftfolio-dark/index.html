<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiftfolio Dark — Professional Template</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap');

    :root {
      --bg: #000000;
      --text: #ffffff;
      --accent: #ffffff;
      --muted: #888888;
      --card-bg: #111111;
      --border: #222222;
      --shadow: rgba(255, 255, 255, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    img { display: block; max-width: 100%; height: auto; }
    h1, h2, h3 { font-weight: 700; color: var(--accent); }
    p { color: var(--muted); font-size: 1rem; }

    /* Navbar */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      z-index: 999;
    }

    .nav-links { display: flex; gap: 2.5rem; }
    nav a {
      text-decoration: none;
      color: var(--muted);
      font-weight: 600;
      transition: 0.3s;
    }
    nav a:hover, nav a.active { color: var(--accent); }

    .nav-indicator {
      position: absolute;
      bottom: 0;
      height: 2px;
      background: var(--accent);
      transition: all 0.4s ease;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: white;
      cursor: pointer;
    }

    /* Sections */
    section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 6rem 2rem;
    }

    #home h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 8vw, 4rem);
      margin-bottom: 1rem;
    }

    .cta-btn {
      display: inline-block;
      background: var(--accent);
      color: var(--bg);
      padding: 0.9rem 2rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 700;
      margin-top: 2rem;
      transition: 0.3s;
    }

    .cta-btn:hover { background: #dddddd; transform: scale(1.05); }

    /* Carousel */
    .carousel-container {
      position: relative;
      max-width: 1200px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 3rem;
    }

    .carousel { overflow: hidden; width: 100%; }
    .track { display: flex; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: calc(50% - 20px);
      margin: 0 10px;
      flex-shrink: 0;
      text-align: left;
      text-decoration: none;
      transition: 0.4s;
    }

    .card:hover { border-color: #555; transform: translateY(-5px); }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      filter: grayscale(100%);
      opacity: 0.7;
      transition: 0.5s;
    }

    .card:hover img { filter: grayscale(0%); opacity: 1; }
    .card-content { padding: 1.5rem; }
    .card h3 { font-size: 1.2rem; margin-bottom: 0.5rem; }

    .arrow {
      background: none;
      border: none;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      opacity: 0.3;
      transition: 0.3s;
    }
    .arrow:hover { opacity: 1; }

    footer {
      padding: 4rem 2rem;
      text-align: center;
      border-top: 1px solid var(--border);
      color: #444;
    }
    footer a { color: var(--muted); text-decoration: none; }

    @media (max-width: 768px) {
      .nav-links {
        position: fixed; right: -100%; top: 0; height: 100vh; width: 80%;
        background: #0a0a0a; flex-direction: column; padding: 6rem 2rem;
        transition: 0.3s;
      }
      .nav-links.active { right: 0; }
      .menu-toggle { display: block; }
      .card { width: calc(100% - 20px); }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo" style="font-weight: 800;">SHIFT<span style="color: var(--muted);">FOLIO</span></div>
    <div class="nav-links">
      <a href="#home" class="active">Home</a>
      <a href="#projects">Work</a>
      <a href="#about">About</a>
    </div>
    <button class="menu-toggle">☰</button>
    <div class="nav-indicator"></div>
  </nav>

  <section id="home">
    <h1>Your Name</h1>
    <p>Your Career</p>
    <a href="#projects" class="cta-btn">Explore Projects</a>
  </section>

  <section id="projects">
    <h2>Selected Projects</h2>
    <div class="carousel-container">
      <button class="arrow" id="prev">&#10094;</button>
      <div class="carousel">
        <div class="track" id="track"></div>
      </div>
      <button class="arrow" id="next">&#10095;</button>
    </div>
  </section>

  <section id="about">
    <h2>About</h2>
    <p style="max-width: 700px;">
      Description of About
    </p>
  </section>

  <footer>
    <p>© 2026 Crafted by <a href="https://payhip.com/CtrlShiftCode">CtrlShiftCode (Abdulrahman Fahim)</a></p>
  </footer>

<script>
  // ==========================================
  // PROJECT DATA (EDIT THIS ARRAY)
  // ==========================================
  const projects_data = [
    {
      title: "Project 1,
      desc: "Description For Project 1",
      image: "shiftfolio-dark.png",
      link: "/shiftfolio-dark"
    },

    {
      title: "Project 2,
      desc: "Description For Project 2",
      image: "shiftfolio-dark.png",
      link: "/shiftfolio-dark"
    },
    {
      title: "Project 3,
      desc: "Description For Project 3",
      image: "shiftfolio-dark.png",
      link: "/shiftfolio-dark"
    }

  // ==========================================
  // DYNAMIC CARD RENDERING
  // ==========================================
  const track = document.getElementById('track');

  projects_data.forEach(p => {
    const card = document.createElement('a');
    card.href = p.link;
    card.className = 'card';
    card.innerHTML = `
      <img src="${p.image}" alt="${p.title}" onerror="this.src='imgs/img.jpg'">
      <div class="card-content">
        <h3>${p.title}</h3>
        <p>${p.desc}</p>
      </div>
    `;
    track.appendChild(card);
  });

  // ==========================================
  // CAROUSEL LOGIC
  // ==========================================
  const nextBtn = document.getElementById('next');
  const prevBtn = document.getElementById('prev');
  let index = 0;

  function updateCarousel() {
    const visibleCards = window.innerWidth <= 768 ? 1 : 2;
    const offset = index * (100 / visibleCards);
    track.style.transform = `translateX(-${offset}%)`;
  }

  nextBtn.addEventListener('click', () => {
    const visibleCards = window.innerWidth <= 768 ? 1 : 2;
    index = (index + 1) % (projects_data.length - (visibleCards - 1));
    if (index >= projects_data.length) index = 0;
    updateCarousel();
  });

  prevBtn.addEventListener('click', () => {
    if (index > 0) index--;
    updateCarousel();
  });

  // Mobile Nav
  const menuBtn = document.querySelector('.menu-toggle');
  const nav = document.querySelector('.nav-links');
  menuBtn.addEventListener('click', () => {
    nav.classList.toggle('active');
    menuBtn.textContent = nav.classList.contains('active') ? '✕' : '☰';
  });

  window.addEventListener('resize', updateCarousel);
</script>
</body>
</html>
