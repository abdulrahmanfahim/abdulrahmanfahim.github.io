<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name — Shiftfolio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap');

    :root {
      --bg: #ffffff;
      --text: #111111;
      --accent: #000000;
      --muted: #666666;
      --card-bg: #f8f8f8;
      --border: #eaeaea;
      --shadow: rgba(0, 0, 0, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }
    img { display: block; max-width: 100%; height: auto; }
    h1, h2, h3 { font-weight: 700; color: var(--accent); }
    p { color: var(--muted); font-size: 1rem; }

    /* Navbar */
    nav { position: fixed; top: 0; width: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; z-index: 999; transition: 0.3s; }
    .nav-links { display: flex; gap: 2.5rem; }
    nav a { text-decoration: none; color: var(--text); font-weight: 600; position: relative; padding: 0.25rem 0; transition: 0.3s; }
    nav a:hover { color: var(--accent); }
    .menu-toggle { display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text); z-index: 1001; }
    .nav-indicator { position: absolute; bottom: 0; height: 2px; background: var(--accent); border-radius: 2px; transition: all 0.4s ease; }

    /* Sections */
    section { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 8rem 2rem 6rem; }
    #home h1 { font-family: 'Playfair Display', serif; font-size: 3.2rem; margin-bottom: 1rem; letter-spacing: 0.5px; }
    #home p { font-size: 1.2rem; max-width: 650px; margin: 0 auto 2rem; }
    .cta-btn { display: inline-block; background: var(--accent); color: #fff; padding: 0.9rem 2rem; border-radius: 6px; text-decoration: none; font-weight: 600; transition: 0.3s; }
    .cta-btn:hover { background: #333; }

    /* Carousel */
    #projects { background: #fafafa; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .carousel-container { position: relative; max-width: 1200px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 3rem; }
    .carousel { overflow: hidden; width: 90%; }
    .track { display: flex; transition: transform 0.7s cubic-bezier(0.25, 0.1, 0.25, 1); }
    
    .card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; width: calc(50% - 30px); margin: 0 15px; flex-shrink: 0; overflow: hidden; box-shadow: 0 4px 12px var(--shadow); transition: all 0.3s ease; text-decoration: none; text-align: left; }
    .card:hover { transform: translateY(-8px); box-shadow: 0 8px 20px var(--shadow); }
    .card img { width: 100%; height: 240px; object-fit: cover; filter: grayscale(100%); transition: 0.4s ease; }
    .card:hover img { filter: grayscale(0%); transform: scale(1.03); }
    .card-content { padding: 1.5rem; }
    .card h3 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    .arrow { border: none; background: transparent; color: var(--accent); font-size: 2.4rem; cursor: pointer; transition: 0.3s; opacity: 0.5; }
    .arrow:hover { opacity: 1; transform: scale(1.1); }

    footer { text-align: center; padding: 3rem 1rem; color: var(--muted); border-top: 1px solid var(--border); font-size: 0.95rem; }
    footer a { color: var(--accent); text-decoration: none; font-weight: 500; }

    @media (max-width: 900px) { .card { width: calc(100% - 30px); } .carousel { width: 100%; } }
    @media (max-width: 768px) {
      .nav-links { position: fixed; top: 0; right: -100%; width: 70%; height: 100vh; background: var(--bg); flex-direction: column; padding: 6rem 2rem; box-shadow: -5px 0 15px var(--shadow); transition: 0.3s; }
      .nav-links.active { right: 0; }
      .menu-toggle { display: block; }
      .nav-indicator { display: none !important; }
      #home h1 { font-size: 2.2rem; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo" style="font-weight: 700; font-size: 1.4rem;">AF.</div>
    <div class="nav-links">
      <a href="#home" class="active">Home</a>
      <a href="#projects">Projects</a>
      <a href="#about">About</a>
    </div>
    <button class="menu-toggle">☰</button>
    <div class="nav-indicator"></div>
  </nav>

  <section id="home">
    <h1>Your Name</h1>
    <p>
      Your Career
    </p>
    <a href="#projects" class="cta-btn">View My Work</a>
  </section>

  <section id="projects">
    <h2>Featured Projects</h2>
    <div class="carousel-container">
      <button class="arrow" id="prev">&#10094;</button>
      <div class="carousel">
        <div class="track" id="track"></div>
      </div>
      <button class="arrow" id="next">&#10095;</button>
    </div>
  </section>

  <section id="about">
    <h2>About</h2>
    <p>
    Description of About
    </p>
  </section>

  <footer>
    <p>© 2026 Abdulrahman Fahim — Built with Shiftfolio</p>
  </footer>

<script>
  // ==========================================
  // PROJECT DATA: EDIT THIS ARRAY TO UPDATE
  // ==========================================
  const projects_data = [
    {
      title: "Project 1,
      desc: "Description For Project 1",
      image: "shiftfolio-light.png",
      link: "/shiftfolio-light"
    },

    {
      title: "Project 2,
      desc: "Description For Project 2",
      image: "shiftfolio-light.png",
      link: "/shiftfolio-light"
    },
    {
      title: "Project 3,
      desc: "Description For Project 3",
      image: "shiftfolio-light.png",
      link: "/shiftfolio-light"
    }

  const track = document.getElementById('track');

  // Create cards dynamically
  projects_data.forEach(p => {
    const card = document.createElement('a');
    card.href = p.link;
    card.className = 'card';
    card.innerHTML = `
      <img src="${p.image}" alt="${p.title}" onerror="this.src='imgs/img.jpg'">
      <div class="card-content">
        <h3>${p.title}</h3>
        <p>${p.desc}</p>
      </div>
    `;
    track.appendChild(card);
  });

  // Navigation Logic
  const menuToggle = document.querySelector('.menu-toggle');
  const navLinks = document.querySelector('.nav-links');
  const navIndicator = document.querySelector('.nav-indicator');

  menuToggle.addEventListener('click', () => {
    navLinks.classList.toggle('active');
    menuToggle.textContent = navLinks.classList.contains('active') ? '✕' : '☰';
  });

  // Carousel Logic
  const nextBtn = document.getElementById('next');
  const prevBtn = document.getElementById('prev');
  let index = 0;
  
  function updateCarousel() {
    let visibleCards = window.innerWidth <= 900 ? 1 : 2;
    const offset = index * (100 / visibleCards);
    track.style.transform = `translateX(-${offset}%)`;
  }

  nextBtn.addEventListener('click', () => {
    let visibleCards = window.innerWidth <= 900 ? 1 : 2;
    if (index < projects_data.length - visibleCards) {
      index++;
      updateCarousel();
    } else {
      index = 0;
      updateCarousel();
    }
  });

  prevBtn.addEventListener('click', () => {
    if (index > 0) {
      index--;
      updateCarousel();
    }
  });

  // Indicator Logic
  function moveIndicator(activeLink) {
    if(window.innerWidth > 768) {
      navIndicator.style.width = `${activeLink.offsetWidth}px`;
      navIndicator.style.left = `${activeLink.offsetLeft}px`;
    }
  }

  document.querySelectorAll('.nav-links a').forEach(link => {
    link.addEventListener('click', (e) => moveIndicator(e.target));
  });

  window.addEventListener('resize', updateCarousel);
</script>
</body>
</html>
